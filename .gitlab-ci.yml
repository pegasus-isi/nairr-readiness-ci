variables:
  # GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: -ffdx
  RUNNER_AFTER_SCRIPT_TIMEOUT: 2m
  RUNNER_SCRIPT_TIMEOUT: -2m

default:
  before_script:
    - env

# .retry-and-timeout: &retry-and-timeout
#   retry: 1
#   timeout: 15 minutes

stages:
  - unit
  - e2e
  - status

include:
  - local: .gitlab/ci/resources/anvil.yml
  - local: .gitlab/ci/resources/expanse.yml
  - local: .gitlab/ci/resources/bridges2.yml
  - local: .gitlab/ci/resources/delta.yml
  # - local: .gitlab/ci/resources/delta-ai.yml
  - local: .gitlab/ci/resources/jetstream.yml
