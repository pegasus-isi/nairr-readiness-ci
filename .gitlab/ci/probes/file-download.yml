spec:
  inputs:
    job_name_prefix:
      description: Must match the job_name_prefix used in the ssh component
    job_name:
      description: CI job name
    resource_id:
      description: Resource ID recorded in the database
      type: number
    probe_id:
      description: Test ID recorded in the database
      type: number
      default: 6
    pre_script:
      description: Pre-script to run before Pegasus
      default: ""
    slurm_partition:
      description: SLURM partition
      default: ""
    slurm_account:
      description: SLURM account
      default: ""
    slurm_time:
      description: SLURM job runtime
      default: "00:00:15"
    slurm_extra_opts:
      description: SLURM extra options
      default: ""

---

$[[ inputs.job_name_prefix ]]-$[[ inputs.job_name ]]:
  stage: e2e
  needs:
    - job: $[[ inputs.job_name_prefix ]]-gitlab-runner-run
  before_script:
    - $[[ inputs.pre_script ]]
  script:
    - |
      set -e
      cat > $[[ inputs.job_name ]].job <<EOF
      #!/bin/bash
      #SBATCH --job-name="$[[ inputs.job_name ]]"
      #SBATCH --partition="$[[ inputs.slurm_partition ]]"
      #SBATCH --time="$[[ inputs.slurm_time ]]"
      #SBATCH --account="$[[ inputs.slurm_account ]]"
      #SBATCH --nodes="1"
      #SBATCH --ntasks="1"

      set -e

      $[[ inputs.pre_script ]]

      # Source env.sh
      . ~/install-pegasus/pegasus/env.sh

      pegasus-transfer <<EOT
      [
        { "type": "transfer",
          "id": 1,
          "src_urls": [ { "site_label": "web", "url": "http://pegasus.isi.edu" } ],
          "dest_urls": [ { "site_label": "local", "url": "file:///tmp/index.html" } ]
        }
      ]
      EOT
      EOF
    - JOBID=$(sbatch $[[ inputs.slurm_extra_opts ]] --output job.log --wait $[[ inputs.job_name ]].job | tail -1 | grep -o [0-9]*)
    - printf '%s' "${JOBID}" >> job.id
    - |
      sacct -X -j $JOBID --format=Submit,Start,End,Elapsed --noheader -P | awk -F'|' '
      {
          cmd = "date -d \"" $1 "\" +%s"; cmd | getline submit_epoch; close(cmd)
          cmd = "date -d \"" $2 "\" +%s"; cmd | getline start_epoch;  close(cmd)
          cmd = "date -d \"" $3 "\" +%s"; cmd | getline end_epoch;    close(cmd)

          queue = start_epoch - submit_epoch
          total = end_epoch - submit_epoch

          printf "Submitted: %s\n", $1
          printf "Started:   %s\n", $2
          printf "Completed: %s\n", $3
          printf "Queued:    %02d:%02d:%02d\n", queue/3600, (queue%3600)/60, queue%60
          printf "Run time:  %s\n", $4
          printf "Total:     %02d:%02d:%02d\n", total/3600, (total%3600)/60, total%60
      }' > statistics.txt
  after_script:
    - printf '$[[ inputs.job_name_prefix ]]_$[[ inputs.job_name ]]_JOB_ID=%s\n' "${CI_JOB_ID}" > .env
    - printf '$[[ inputs.job_name_prefix ]]_$[[ inputs.job_name ]]_STATUS=%s\n' "${CI_JOB_STATUS}" >> .env
    - cat job.log
    - cat statistics.txt
    - $[[ inputs.pre_script ]]
    - scancel `cat job.id`
  artifacts:
    when: always
    access: developer
    paths:
      - job.log
      - statistics.txt
    reports:
      dotenv: .env
  allow_failure: true
  tags:
    - $[[ inputs.job_name_prefix ]]

include:
  - local: .gitlab/ci/components/update-status.yml
    inputs:
      job_name_prefix: $[[ inputs.job_name_prefix ]]
      job_name: $[[ inputs.job_name ]]
      resource_id: $[[ inputs.resource_id ]]
      probe_id: $[[ inputs.probe_id ]]
