spec:
  inputs:
    job_name_prefix:
      description: Must match the job_name_prefix used in the ssh component
    resource_id:
      description: Resource ID recorded in the database
      type: number
    probe_id:
      description: Test ID recorded in the database
      default: 3
      type: number
    pre_script:
      description: Pre-script to run before Pegasus
      default: ""
    pegasus_lite_env_source:
      description: Pegasus Lite environment source
      default: ""
    slurm_cpu_partition:
      description: SLURM CPU partition
    slurm_gpu_partition:
      description: SLURM GPU partition
    workflow_generator:
      description: Workflow generator script
      default: training

---

$[[ inputs.job_name_prefix ]]-pegasus-$[[ inputs.workflow_generator ]]:
  stage: e2e
  needs:
    - job: $[[ inputs.job_name_prefix ]]-gitlab-runner-run
  variables:
    SLURM_CPU_PARTITION: $[[ inputs.slurm_cpu_partition ]]
    SLURM_GPU_PARTITION: $[[ inputs.slurm_gpu_partition ]]
  before_script:
    - $[[ inputs.pre_script ]]
    - |
      if [[ "${INSTALL_CONDOR}" == "true" ]]; then
        # Source env.sh
        USER_HOME=$(eval "realpath ~$USER")
        . ${USER_HOME}/install-pegasus/pegasus/env.sh

        # Set PYTHONPATH so import Pegasus works
        export PYTHONPATH=`pegasus-config --python`:${USER_HOME}/install-pegasus/python-deps
      fi
  script:
    - |
      cd ${CI_PROJECT_DIR}/workflows/crophealth
      set -e
      if [[ -n "$[[ inputs.pegasus_lite_env_source ]]" ]]; then
        cat > pegasus_lite_env_source <<EOF
        $[[ inputs.pegasus_lite_env_source ]]
      EOF
      fi
      python3 $[[ inputs.workflow_generator ]].py
      sleep 5
      pegasus-status -w5 -l submit
    - |
      set +e
      pegasus-status --jsonrv submit | grep -i state.*fail
      EC=$?
      if [[ "$EC" -eq 0 ]]; then
        exit 1
      fi
  after_script:
    - printf '$[[ inputs.job_name_prefix ]]_PEGASUS_$[[ inputs.workflow_generator ]]_JOB_ID=%s\n' "${CI_JOB_ID}" > .env
    - printf '$[[ inputs.job_name_prefix ]]_PEGASUS_$[[ inputs.workflow_generator ]]_STATUS=%s\n' "${CI_JOB_STATUS}" >> .env
    - $[[ inputs.pre_script ]]
    - |
      if [[ "${INSTALL_CONDOR}" == "true" ]]; then
        # Source env.sh
        USER_HOME=$(eval "realpath ~$USER")
        . ${USER_HOME}/install-pegasus/pegasus/env.sh

        # Set PYTHONPATH so import Pegasus works
        export PYTHONPATH=`pegasus-config --python`:${USER_HOME}/install-pegasus/python-deps
      fi
    - pegasus-remove ${CI_PROJECT_DIR}/workflows/crophealth/submit
  artifacts:
    when: always
    access: developer
    paths:
      - workflows/crophealth/submit
    reports:
      dotenv: .env
  allow_failure: true
  tags:
    - $[[ inputs.job_name_prefix ]]


$[[ inputs.job_name_prefix ]]-pegasus-$[[ inputs.workflow_generator ]]-status:
  stage: status
  image: rockylinux:9
  needs:
    - job: $[[ inputs.job_name_prefix ]]-pegasus-$[[ inputs.workflow_generator ]]
      artifacts: true
  before_script:
    - dnf -y install mysql vim-common
  script:
    - VAR_NAME="$[[ inputs.job_name_prefix ]]_PEGASUS_$[[ inputs.workflow_generator ]]_JOB_ID"
    - JOB_ID="${!VAR_NAME}"
    - VAR_NAME="$[[ inputs.job_name_prefix ]]_PEGASUS_$[[ inputs.workflow_generator ]]_STATUS"
    - STATUS="${!VAR_NAME}"
    - |
      echo "Status: $STATUS"
      if [[ "$STATUS" == "canceled" ]]; then
        exit 0
      fi

      if [[ -z "$STATUS" ]]; then
        STATUS="timeout"
      fi

      PROBE_LOG=$(curl --location --header "PRIVATE-TOKEN: $GITLAB_JOB_LOG_TOKEN" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${JOB_ID}/trace" | xxd -p | tr -d '\n')
      export MYSQL_PWD="${NAIRR_DB_PASS}"
      EXTRA="{\"pipeline_url\": \"${CI_PIPELINE_URL}\", \"job_id\": \"${JOB_ID}\"}"
      mysql -u${NAIRR_DB_USER} -h${NAIRR_DB_HOST} ${NAIRR_DB_NAME} \
        -e "INSERT INTO readiness_results (resource_id, version, uid, etag, probe_id, probe_status, probe_log, probe_timestamp, extra, created_at, created_by, updated_at, updated_by) \
            VALUES($[[ inputs.resource_id ]], '0.0.0', UUID(), UUID(), $[[ inputs.probe_id ]], '${STATUS}', 0x${PROBE_LOG}, UTC_TIMESTAMP(), '${EXTRA}', UTC_TIMESTAMP(), 'mayani', UTC_TIMESTAMP(), 'mayani');"
  tags:
    - docker
