spec:
  inputs:
    job_name_prefix:
      description: Must match the job_name_prefix used in the ssh component
    job_name:
      description: CI job name
    resource_id:
      description: Resource ID recorded in the database
      type: number
    probe_id:
      description: Test ID recorded in the database
      type: number
      default: 5
    pre_script:
      description: Pre-script to run before Pegasus
      default: ""
    htcondor_requirements:
      description: HTCondor requirements value
      default: ""
    htcondor_project:
      description: HTCondor project name
      default: ""

---

$[[ inputs.job_name_prefix ]]-$[[ inputs.job_name ]]:
  stage: e2e
  needs:
    - job: $[[ inputs.job_name_prefix ]]-gitlab-runner-run
  variables:
    RESOURCE: $[[ inputs.job_name_prefix ]]
  before_script:
    - $[[ inputs.pre_script ]]
    - |
      if [[ "${INSTALL_CONDOR}" == "true" ]]; then
        # Source env.sh
        USER_HOME=$(eval "realpath ~$USER")
        . ${USER_HOME}/install-pegasus/pegasus/env.sh

        # Set PYTHONPATH so import Pegasus works
        export PYTHONPATH=`pegasus-config --python`:${USER_HOME}/install-pegasus/python-deps
      fi
  script:
    - |
      set -e
      cat > $[[ inputs.job_name ]].job <<EOF
      universe = vanilla
      executable = /usr/bin/hostname
      transfer_executable = false
      output = job.log

      $(if [ -n "$[[ inputs.htcondor_requirements ]]" ]; then
        echo 'requirements = $[[ inputs.htcondor_requirements ]]'
      fi)
      $(if [ -n "$[[ inputs.htcondor_project ]]" ]; then
        echo '+ProjectName = "$[[ inputs.htcondor_project ]]"'
      fi)

      queue
      EOF
    - CLUSTER=`condor_submit -terse $[[ inputs.job_name ]].job`
    - printf '%s' "${CLUSTER}" >> job.id
    - |
      until condor_history "$CLUSTER" -af ExitCode 2>/dev/null | grep -qE '^[0-9]+$'; do
        sleep 2
      done
    - |
      condor_history "$CLUSTER" -af QDate JobCurrentStartDate CompletionDate |
      awk '
      {
          submit=$1
          start=$2
          end=$3

          queue = start - submit
          runtime = end - start
          total = end - submit

          printf "Submitted: %s\n", strftime("%Y-%m-%dT%H:%M:%S", submit)
          printf "Started:   %s\n", strftime("%Y-%m-%dT%H:%M:%S", start)
          printf "Completed: %s\n", strftime("%Y-%m-%dT%H:%M:%S", end)
          printf "Queued:    %02d:%02d:%02d\n", queue/3600, (queue%3600)/60, queue%60
          printf "Run time:  %02d:%02d:%02d\n", runtime/3600, (runtime%3600)/60, runtime%60
          printf "Total:     %02d:%02d:%02d\n", total/3600, (total%3600)/60, total%60
      }' > statistics.txt
    - exit `condor_history "$CLUSTER" -af ExitCode`
  after_script:
    - printf '$[[ inputs.job_name_prefix ]]_$[[ inputs.job_name ]]_JOB_ID=%s\n' "${CI_JOB_ID}" > .env
    - printf '$[[ inputs.job_name_prefix ]]_$[[ inputs.job_name ]]_STATUS=%s\n' "${CI_JOB_STATUS}" >> .env
    - cat job.log
    - cat statistics.txt
    - |
      if [[ "${INSTALL_CONDOR}" == "true" ]]; then
        # Source env.sh
        USER_HOME=$(eval "realpath ~$USER")
        . ${USER_HOME}/install-pegasus/pegasus/env.sh

        # Set PYTHONPATH so import Pegasus works
        export PYTHONPATH=`pegasus-config --python`:${USER_HOME}/install-pegasus/python-deps
      fi
    - condor_rm `cat job.id`
  artifacts:
    when: always
    access: developer
    paths:
      - job.log
      - statistics.txt
    reports:
      dotenv: .env
  allow_failure: true
  tags:
    - $[[ inputs.job_name_prefix ]]

include:
  - local: .gitlab/ci/components/update-status.yml
    inputs:
      job_name_prefix: $[[ inputs.job_name_prefix ]]
      job_name: $[[ inputs.job_name ]]
      resource_id: $[[ inputs.resource_id ]]
      probe_id: $[[ inputs.probe_id ]]
