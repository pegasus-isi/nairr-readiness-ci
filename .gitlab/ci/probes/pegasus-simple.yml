spec:
  inputs:
    job_name_prefix:
      description: Must match the job_name_prefix used in the ssh component
    resource_id:
      description: Resource ID recorded in the database
      type: number
    probe_id:
      description: Test ID recorded in the database
      default: 1
      type: number
    pre_script:
      description: Pre-script to run before Pegasus
      default: ""

---

$[[ inputs.job_name_prefix ]]-pegasus-simple:
  stage: e2e
  needs:
    - job: $[[ inputs.job_name_prefix ]]-gitlab-runner-run
  before_script:
    # - dnf -y install mysql
    - $[[ inputs.pre_script ]]
    - |
      # Setup
      rm -rf install-pegasus
      mkdir install-pegasus
      cd install-pegasus

      # Get Pegasus
      curl -s https://raw.githubusercontent.com/pegasus-isi/get-pegasus/refs/heads/main/get_pegasus | python3

      # Install Python dependencies
      mkdir python-deps
      python3 -m pip install -t python-deps dataclasses pyyaml gitpython

      # Source env.sh
      . ${CI_PROJECT_DIR}/pegasus-5.1.3-dev.0/env.sh

      # Set PYTHONPATH so import Pegasus works
      export PYTHONPATH=`pegasus-config --python`:`pwd`/python-deps

      # Workflow Example
      mkdir workflow
      cd workflow
      condor_master
      sleep 5
  script:
    - |
      cp ${CI_PROJECT_DIR}/workflows/pegasus-simple.py ./workflow.py
      python3 workflow.py
      pegasus-status -w5 -l abc
      condor_off
  after_script:
    - |
      export MYSQL_PWD="${NAIRR_DB_PASS}"
      STATUS="PASS"
      if [ "$CI_JOB_STATUS" = "failed" ]; then STATUS="FAIL"; fi
      mysql -u${NAIRR_DB_USER} -h${NAIRR_DB_HOST} ${NAIRR_DB_NAME} \
        -e "INSERT INTO readiness_results (resource_id, version, uid, etag, test_ssh_connectivity_id, test_ssh_connectivity_status, test_ssh_connectivity_timestamp, created_at, created_by, updated_at, updated_by) \
            VALUES($[[ inputs.resource_id ]], '0.0.0', UUID(), UUID(), $[[ inputs.probe_id ]], '${STATUS}', NOW(), NOW(), 'mayani', NOW(), 'mayani');"
  artifacts:
    when: always
    paths:
      - install-pegasus/workflow
  tags:
    - $[[ inputs.job_name_prefix ]]
