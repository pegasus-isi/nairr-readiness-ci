spec:
  inputs:
    job_name_prefix:
      description: Which runner to wait for
      default: ACCESS

---

$[[ inputs.job_name_prefix ]]-gitlab-runner-run:
  stage: unit
  image: rockylinux:9
  needs:
    - job: $[[ inputs.job_name_prefix ]]-gitlab-runner-run
  script:
    - echo "Done"
  tags:
    - docker
  artifacts:
    access: developer
