spec:
  inputs:
    job_name_prefix:
      description: Prefix for the CI job name and dotenv variable (must be unique per pipeline)
      default: glab
    ssh_mfa_type:
      description: MFA type for the target host (totp, or empty for none)
      default: ""
    ssh_mfa_prompt:
      description: Keyboard-interactive prompt string for MFA
      default: ""
    ssh_mfa_shared_secret:
      description: TOTP shared secret for MFA
      default: ""
    gitlab_url:
      description: GitLab URL
    gitlab_runner_arch:
      description: GitLab Runner architecture
      default: amd64
    gitlab_runner_id:
      description: GitLab Runner ID
    gitlab_runner_uid:
      description: GitLab Runner UID
    gitlab_runner_token:
      description: GitLab Runner Token
    slurm_partition:
      description: SLURM partition
    slurm_account:
      description: SLURM account
    slurm_time:
      description: SLURM job runtime
      default: "00:30:00"
    slurm_extra_opts:
      description: SLURM extra options
      default: ""
    force_install_condor:
      description: Force Install Condor
      type: boolean
      default: false
    install_condor:
      description: Install Condor
      type: boolean
      default: true

---

$[[ inputs.job_name_prefix ]]-gitlab-runner-run:
  stage: unit
  image: rockylinux:9
  needs:
    - job: $[[ inputs.job_name_prefix ]]-ssh-cmd
      artifacts: true
  before_script:
    - dnf -y install openssh-clients
    - |
      if [[ "$[[ inputs.ssh_mfa_type ]]" == "totp" ]]; then
        dnf -y install sshpass python3-pip
        pip3 install pyotp
      fi
  script:
    - |
      set -e
      REMOTE_CMD="
      set -e
      mkdir -p .gitlab-runner
      cat > .gitlab-runner/config.toml <<EOF
      concurrent = 2
      check_interval = 0
      connection_max_age = \"15m0s\"
      shutdown_timeout = 0

      [session_server]
        session_timeout = 1800

      [[runners]]
        name = \"$[[ inputs.job_name_prefix ]]\"
        url = \"$[[ inputs.gitlab_url ]]\"
        id = $[[ inputs.gitlab_runner_id ]]
        token = \"$[[ inputs.gitlab_runner_token ]]\"
        # token_obtained_at = 2026-04-17T20:13:04Z
        # token_expires_at = 0001-01-01T00:00:00Z
        executor = \"shell\"
        [runners.cache]
          MaxUploadedArchiveSize = 0
          [runners.cache.s3]
            AssumeRoleMaxConcurrency = 0
          [runners.cache.gcs]
          [runners.cache.azure]
      EOF
      "

    - |
      REMOTE_CMD="${REMOTE_CMD}
      cat > .gitlab-runner/.runner_system_id <<EOF
      $[[ inputs.gitlab_runner_uid ]]
      EOF
      "

    - |
      REMOTE_CMD="${REMOTE_CMD}
      set +e
      scancel --name=\"$[[ inputs.job_name_prefix ]]-gitlab-runner\" && true
      set -e
      curl -L --output .gitlab-runner/gitlab-runner https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-linux-$[[ inputs.gitlab_runner_arch ]]
      chmod +x .gitlab-runner/gitlab-runner
      "

    - |
      REMOTE_CMD="${REMOTE_CMD}
      if [[ \"$[[ inputs.force_install_condor ]]\" == \"true\" ]]; then
        rm -rf install-pegasus
      fi

      if [ ! -d "install-pegasus" ]; then
        mkdir install-pegasus
        pushd install-pegasus

        # Get Pegasus
        curl -s https://raw.githubusercontent.com/pegasus-isi/get-pegasus/refs/heads/main/get_pegasus | python3 - --target pegasus

        # Install Python dependencies
        mkdir python-deps
        python3 -m pip install -t python-deps dataclasses pyyaml gitpython
        popd
      fi
      "

    - |
      REMOTE_CMD="${REMOTE_CMD}
      cat > gitlab-runner.job <<EOF
      #!/bin/bash
      #SBATCH --job-name=\"$[[ inputs.job_name_prefix ]]-gitlab-runner\"
      #SBATCH --partition=\"$[[ inputs.slurm_partition ]]\"
      #SBATCH --time=\"$[[ inputs.slurm_time ]]\"
      #SBATCH --account=\"$[[ inputs.slurm_account ]]\"
      #SBATCH --nodes=\"1\"
      #SBATCH --ntasks=\"1\"

      set -e

      # Source env.sh
      . ~/install-pegasus/pegasus/env.sh

      # Configure SLURM
      pegasus-configure-glite

      if [[ \"$[[ inputs.install_condor ]]\" == \"true\" ]]; then
        condor_master
        sleep 5
      fi

      .gitlab-runner/gitlab-runner run
      EOF
      chmod +x gitlab-runner.job
      "

    - |
      REMOTE_CMD="${REMOTE_CMD}
      JOBID=\$(sbatch $[[ inputs.slurm_extra_opts ]] gitlab-runner.job | grep -o [0-9]*)
      set +ex
      while true; do
        IS_RUNNING=\$(squeue -u \"\$USER\" --name=\"$[[ inputs.job_name_prefix ]]-gitlab-runner\" -j \${JOBID} -t RUNNING --noheader)
        if [[ -n \${IS_RUNNING} ]]; then
          echo $[[ inputs.job_name_prefix ]]_GITLAB_RUN_JOB_ID=\"\${JOBID}\"
          break
        fi
        sleep 5
      done
      "

    - |
      VAR_NAME="$[[ inputs.job_name_prefix ]]_SSH_CMD"
      SSH_CMD="${!VAR_NAME}"

      for key_file in $(echo "${SSH_CMD}" | grep -oP '(?<=-i )\S+'); do
        chmod 600 "$(eval echo ${key_file})"
      done

      PREFIX=""
      if [[ "$[[ inputs.ssh_mfa_type ]]" == "totp" ]]; then
        MFA_SECRET="$[[ inputs.ssh_mfa_shared_secret ]]"
        export SSHPASS=$(python3 -c "import pyotp; print(pyotp.TOTP('${MFA_SECRET}').now())")
        PREFIX="sshpass -P '$[[ inputs.ssh_mfa_prompt ]]' -e"
      fi

      eval "${PREFIX} ${SSH_CMD} '${REMOTE_CMD}'" 2>&1 | tee out
      cat out | grep _GITLAB_RUN_JOB_ID > .env
  tags:
    - docker
  artifacts:
    access: developer
    reports:
      dotenv: .env