spec:
  inputs:
    job_name_prefix:
      description: Prefix for the CI job name and dotenv variable (must be unique per pipeline)
      default: glab
    ssh_host:
      description: Target SSH hostname
    ssh_port:
      description: Target SSH port
      default: 22
      type: number
    ssh_user:
      description: Username for the target host
    ssh_password_var:
      description: Name fo SSH password variable
      default: ""
    ssh_options:
      description: Additional SSH options for the target host connection
      default: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    ssh_mfa_type:
      description: MFA type for the target host (totp, or empty for none)
      default: ""
    ssh_mfa_prompt:
      description: Keyboard-interactive prompt string for MFA
      default: ""
    ssh_mfa_shared_secret:
      description: TOTP shared secret for MFA
      default: ""
    gitlab_url:
      description: GitLab URL
    gitlab_runner_arch:
      description: GitLab Runner architecture
      default: amd64
    gitlab_runner_id:
      description: GitLab Runner ID
    gitlab_runner_uid:
      description: GitLab Runner UID
    gitlab_runner_token:
      description: GitLab Runner Token
    slurm_partition:
      description: SLURM partition
    slurm_account:
      description: SLURM account
    slurm_time:
      description: SLURM job runtime
      default: "00:30:00"
    slurm_extra_opts:
      description: SLURM extra options
      default: ""
    force_install_runner:
      description: Force Install GitLab
      type: boolean
      default: false
    force_install_condor:
      description: Force Install Condor
      type: boolean
      default: false
    install_condor:
      description: Install Condor
      type: boolean
      default: true
    site_shared_scratch:
      description: Shared Scratch
    site_local_scratch_var:
      description: Local Scratch variable

---

$[[ inputs.job_name_prefix ]]-gitlab-runner-run:
  stage: unit
  image: rockylinux:9
  script:
    - dnf -y install expect openssh-clients
    - |
      cat > ssh-expect.sh <<EOF
      #!/usr/bin/expect -f
      # Usage: DELTA_PASS=... [DELTA_DUO=1] ./a.sh ssh user@host [args...]
      set timeout 60

      spawn {*}\$argv

      expect -nocase "password:"
      send -- "\$env(DELTA_PASS)\r"

      expect "Passcode or option"
      send -- "[expr {[info exists env(DELTA_DUO)] ? \$env(DELTA_DUO) : 1}]\r"

      interact
      EOF
    - chmod +x ssh-expect.sh
    - export DELTA_PASS=${$[[ inputs.ssh_password_var ]]}
    - export DELTA_DUO=1
    - ./ssh-expect.sh ssh $[[ inputs.ssh_options ]] -l $[[ inputs.ssh_user ]] -p $[[ inputs.ssh_port ]] $[[ inputs.ssh_host ]] sbatch gitlab-runner.job

  tags:
    - docker
  artifacts:
    access: developer
