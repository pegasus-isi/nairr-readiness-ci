spec:
  inputs:
    job_name_prefix:
      description: Prefix for the CI job name
    job_name:
      description: CI job name
    resource_id:
      description: Resource ID recorded in the database
      type: number
    probe_id:
      description: Test ID recorded in the database
      type: number

---

$[[ inputs.job_name_prefix ]]-$[[ inputs.job_name ]]-status:
  stage: status
  image: rockylinux:9
  needs:
    - job: $[[ inputs.job_name_prefix ]]-$[[ inputs.job_name ]]
      artifacts: true
  before_script:
    - dnf -y install mysql vim-common
  script:
    - VAR_NAME="$[[ inputs.job_name_prefix ]]_$[[ inputs.job_name ]]_JOB_ID"
    - JOB_ID="${!VAR_NAME}"
    - VAR_NAME="$[[ inputs.job_name_prefix ]]_$[[ inputs.job_name ]]_STATUS"
    - STATUS="${!VAR_NAME}"
    - |
      echo "Status: $STATUS"
      if [[ "$STATUS" == "canceled" ]]; then
        echo "Job canceled, exiting..."
        exit 0
      fi

      if [[ -z "$STATUS" || "$STATUS" == "timedout" ]]; then
        STATUS="timeout"
      fi

      PROBE_STATISTICS=""
      if [ -f statistics.txt ]; then
        PROBE_STATISTICS=$(cat statistics.txt | xxd -p | tr -d '\n')
      fi

      PROBE_LOG=$(curl --location --header "PRIVATE-TOKEN: $GITLAB_JOB_LOG_TOKEN" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${JOB_ID}/trace" | xxd -p | tr -d '\n')
      export MYSQL_PWD="${NAIRR_DB_PASS}"
      EXTRA="{\"pipeline_url\": \"${CI_PIPELINE_URL}\", \"job_id\": \"${JOB_ID}\"}"
      mysql -u${NAIRR_DB_USER} -h${NAIRR_DB_HOST} ${NAIRR_DB_NAME} <<SQL
      INSERT INTO readiness_results (resource_id, version, uid, etag, probe_id, probe_status, probe_log, probe_statistics, probe_timestamp, extra, created_at, created_by, updated_at, updated_by)
      VALUES($[[ inputs.resource_id ]], '0.0.0', UUID(), UUID(), $[[ inputs.probe_id ]], '${STATUS}', 0x${PROBE_LOG}, 0x${PROBE_STATISTICS}, UTC_TIMESTAMP(), '${EXTRA}', UTC_TIMESTAMP(), 'mayani', UTC_TIMESTAMP(), 'mayani');
      SQL
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
