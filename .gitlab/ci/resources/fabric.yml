include:
  - local: .gitlab/ci/components/vm.yml
    inputs:
      job_name_prefix: FABRIC
      gitlab_url: ${GITLAB_URL}
      gitlab_runner_id: ${ACCESS_GITLAB_RUNNER_ID}
      gitlab_runner_uid: ${ACCESS_GITLAB_RUNNER_UID}
      gitlab_runner_token: ${ACCESS_GITLAB_RUNNER_TOKEN}
      run_on_login_node: true
      install_condor: false
  - local: .gitlab/ci/probes/pegasus-simple.yml
    inputs:
      job_name_prefix: FABRIC
      resource_id: 10
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: FABRIC
      resource_id: 10
      slurm_cpu_partition: not-used
      slurm_gpu_partition: not-used
      workflow_generator: training
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: FABRIC
      resource_id: 10
      probe_id: 4
      slurm_cpu_partition: not-used
      slurm_gpu_partition: not-used
      workflow_generator: inference
  - local: .gitlab/ci/probes/job-submit-htcondor.yml
    inputs:
      job_name_prefix: FABRIC
      job_name: job_submit
      resource_id: 10
