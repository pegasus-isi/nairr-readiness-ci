# URL: https://docs.ncsa.illinois.edu/systems/delta/en/latest/index.html
# URL: https://docs.ncsa.illinois.edu/systems/deltaai/en/latest/user-guide/data-mgmt.html
include:
  # Can't do as this requires Duo MFA
  # - local: .gitlab/ci/components/ssh.yml
  #   inputs:
  #     job_name_prefix: DELTA
  #     ssh_host: login.delta.ncsa.illinois.edu
  #     ssh_user: $DELTA_SSH_USER
  #     ssh_key_file: $DELTA_SSH_KEY_FILE
  # - local: .gitlab/ci/probes/ssh.yml
  #   inputs:
  #     job_name_prefix: DELTA
  #     resource_id: 4

  - local: .gitlab/ci/components/manual-runner.yml
    inputs:
      job_name_prefix: DELTA
      gitlab_url: ${GITLAB_URL}
      gitlab_runner_id: ${DELTA_GITLAB_RUNNER_ID}
      gitlab_runner_uid: ${DELTA_GITLAB_RUNNER_UID}
      gitlab_runner_token: ${DELTA_GITLAB_RUNNER_TOKEN}
      slurm_partition: cpu
      slurm_account: bfof-delta-cpu
      slurm_time: "04:00:00"
      site_shared_scratch: /scratch/bfof/mayani
      site_local_scratch_var: TMPDIR

  - local: .gitlab/ci/probes/pegasus-simple.yml
    inputs:
      job_name_prefix: DELTA
      resource_id: 4
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: DELTA
      resource_id: 4
      slurm_cpu_partition: cpu
      slurm_gpu_partition: gpuA100x4
      workflow_generator: training
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: DELTA
      resource_id: 4
      probe_id: 4
      slurm_cpu_partition: cpu
      slurm_gpu_partition: gpuA100x4
      workflow_generator: inference
  - local: .gitlab/ci/probes/job-submit.yml
    inputs:
      job_name_prefix: DELTA
      job_name: job_submit
      resource_id: 4
      slurm_partition: cpu
      slurm_account: bfof-delta-cpu
  - local: .gitlab/ci/probes/file-download.yml
    inputs:
      job_name_prefix: DELTA
      job_name: file_download
      resource_id: 4
      slurm_partition: cpu
      slurm_account: bfof-delta-cpu
