# Shared scratch: /expanse/lustre/scratch/<user>
# Node Local: /tmp or ${TMPDIR}
include:
  - local: .gitlab/ci/components/ssh.yml
    inputs:
      job_name_prefix: STAMPEDE3
      ssh_host: stampede3.tacc.utexas.edu
      ssh_user: $STAMPEDE3_SSH_USER
      ssh_key_file: $STAMPEDE3_SSH_KEY_FILE
  - local: .gitlab/ci/probes/ssh.yml
    inputs:
      job_name_prefix: STAMPEDE3
      resource_id: 7
      ssh_mfa_type: totp
      ssh_mfa_prompt: TACC Token Code
      ssh_mfa_shared_secret: $STAMPEDE3_SSH_MFA_SHARED_SECRET

  - local: .gitlab/ci/components/runner.yml
    inputs:
      job_name_prefix: STAMPEDE3
      ssh_mfa_type: totp
      ssh_mfa_prompt: TACC Token Code
      ssh_mfa_shared_secret: $STAMPEDE3_SSH_MFA_SHARED_SECRET
      gitlab_url: ${GITLAB_URL}
      gitlab_runner_id: ${STAMPEDE3_GITLAB_RUNNER_ID}
      gitlab_runner_uid: ${STAMPEDE3_GITLAB_RUNNER_UID}
      gitlab_runner_token: ${STAMPEDE3_GITLAB_RUNNER_TOKEN}
      run_on_login_node: true
      slurm_account: TG-STA230005
      # TACC has Python 3.12 on the login node, but Python 3.9 on the compute node
      pre_script: module load python/3.9.18
      site_shared_scratch: \${SCRATCH}
      site_local_scratch_var: TMPDIR
  - local: .gitlab/ci/probes/job-submit.yml
    inputs:
      job_name_prefix: STAMPEDE3
      job_name: job_submit
      resource_id: 7
      probe_id: 5
      slurm_partition: icx
      slurm_account: TG-STA230005
  - local: .gitlab/ci/probes/file-download.yml
    inputs:
      job_name_prefix: STAMPEDE3
      job_name: file_download
      resource_id: 7
      probe_id: 6
      # TACC has Python 3.12 on the login node, but Python 3.9 on the compute node
      pre_script: module load python/3.9.18
      slurm_partition: icx
      slurm_account: TG-STA230005
