  - local: .gitlab/ci/components/manual-runner.yml
    inputs:
      job_name_prefix: DELTA_AI
      gitlab_url: ${GITLAB_URL}
      gitlab_runner_id: ${DELTA_AI_GITLAB_RUNNER_ID}
      gitlab_runner_uid: ${DELTA_AI_GITLAB_RUNNER_UID}
      gitlab_runner_token: ${DELTA_AI_GITLAB_RUNNER_TOKEN}
      slurm_partition: ghx4
      slurm_account: bfof-dtai-gh
      slurm_time: "04:00:00"
      slurm_extra_opts: --gpus=1
      site_shared_scratch: /work/nvme/bfof/mayani
      site_local_scratch_var: TMPDIR

  - local: .gitlab/ci/probes/pegasus-simple.yml
    inputs:
      job_name_prefix: DELTA_AI
      resource_id: 5
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: DELTA_AI
      resource_id: 5
      slurm_cpu_partition: test
      slurm_gpu_partition: GPU-shared
      workflow_generator: training
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: DELTA_AI
      resource_id: 5
      probe_id: 4
      slurm_cpu_partition: test
      slurm_gpu_partition: GPU-shared
      workflow_generator: inference
