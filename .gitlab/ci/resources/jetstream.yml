include:
  - local: .gitlab/ci/components/ssh.yml
    inputs:
      job_name_prefix: JETSTREAM
      ssh_host: pegasus.access-ci.org
      ssh_user: $ACCESS_SSH_USER
      ssh_key_file: $ACCESS_SSH_KEY_FILE
  - local: .gitlab/ci/probes/ssh.yml
    inputs:
      job_name_prefix: ACCESS
      resource_id: 6

  - local: .gitlab/ci/components/runner.yml
    inputs:
      job_name_prefix: ACCESS
      gitlab_url: ${GITLAB_URL}
      gitlab_runner_id: ${ACCESS_GITLAB_RUNNER_ID}
      gitlab_runner_uid: ${ACCESS_GITLAB_RUNNER_UID}
      gitlab_runner_token: ${ACCESS_GITLAB_RUNNER_TOKEN}
      slurm_partition: shared
      slurm_account: sta230005
      slurm_time: "03:00:00"
      site_shared_scratch: \${CLUSTER_SCRATCH}
      site_local_scratch_var: TMPDIR
  - local: .gitlab/ci/probes/pegasus-simple.yml
    inputs:
      job_name_prefix: JETSTREAM
      resource_id: 6
      probe_id: 2
