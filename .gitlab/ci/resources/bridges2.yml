# URL: https://www.psc.edu/resources/bridges-2/user-guide/
# Shared Scratch: /ocean/projects/<allocation>/<user>/ or ${PROJECT}
# Node Local: /local or ${LOCAL}
include:
  - local: .gitlab/ci/components/ssh.yml
    inputs:
      job_name_prefix: BRIDGES
      ssh_host: bridges2.psc.edu
      ssh_user: $BRIDGES_SSH_USER
      ssh_key_file: $BRIDGES_SSH_KEY_FILE
  - local: .gitlab/ci/probes/ssh.yml
    inputs:
      job_name_prefix: BRIDGES
      resource_id: 3

  - local: .gitlab/ci/components/runner.yml
    inputs:
      job_name_prefix: BRIDGES
      gitlab_url: ${GITLAB_URL}
      gitlab_runner_id: ${BRIDGES_GITLAB_RUNNER_ID}
      gitlab_runner_uid: ${BRIDGES_GITLAB_RUNNER_UID}
      gitlab_runner_token: ${BRIDGES_GITLAB_RUNNER_TOKEN}
      slurm_partition: RM-shared
      slurm_account: sta230005p
      slurm_time: "03:00:00"
      site_shared_scratch: \${PROJECT}
      site_local_scratch_var: LOCAL
  - local: .gitlab/ci/probes/pegasus-simple.yml
    inputs:
      job_name_prefix: BRIDGES
      resource_id: 3
      probe_id: 2
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: BRIDGES
      resource_id: 3
      probe_id: 3
      slurm_cpu_partition: RM-shared
      slurm_gpu_partition: GPU-shared
      workflow_generator: training
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: BRIDGES
      resource_id: 3
      probe_id: 4
      slurm_cpu_partition: RM-shared
      slurm_gpu_partition: GPU-shared
      workflow_generator: inference
