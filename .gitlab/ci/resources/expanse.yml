# Shared scratch: /expanse/lustre/scratch/<user>/temp_project
# Node Local: /tmp or ${TMPDIR}
include:
  - local: .gitlab/ci/components/ssh.yml
    inputs:
      job_name_prefix: EXPANSE
      ssh_host: login.expanse.sdsc.edu
      ssh_user: $EXPANSE_SSH_USER
      ssh_key_file: $EXPANSE_SSH_KEY_FILE
  - local: .gitlab/ci/probes/ssh.yml
    inputs:
      job_name_prefix: EXPANSE
      resource_id: 2
      ssh_mfa_type: totp
      ssh_mfa_prompt: TOTP code
      ssh_mfa_shared_secret: $EXPANSE_SSH_MFA_SHARED_SECRET

  - local: .gitlab/ci/components/runner.yml
    inputs:
      job_name_prefix: EXPANSE
      ssh_mfa_type: totp
      ssh_mfa_prompt: TOTP code
      ssh_mfa_shared_secret: $EXPANSE_SSH_MFA_SHARED_SECRET
      gitlab_url: ${GITLAB_URL}
      gitlab_runner_id: ${EXPANSE_GITLAB_RUNNER_ID}
      gitlab_runner_uid: ${EXPANSE_GITLAB_RUNNER_UID}
      gitlab_runner_token: ${EXPANSE_GITLAB_RUNNER_TOKEN}
      slurm_partition: shared
      slurm_account: TG-STA230005
      slurm_time: "03:00:00"
      site_shared_scratch: /expanse/lustre/scratch/mayani/temp_project
      site_local_scratch_var: TMPDIR
  - local: .gitlab/ci/probes/pegasus-simple.yml
    inputs:
      job_name_prefix: EXPANSE
      resource_id: 2
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: EXPANSE
      pegasus_lite_env_source: module load singularitypro
      resource_id: 2
      slurm_cpu_partition: shared
      slurm_gpu_partition: gpu-shared
      workflow_generator: training
  - local: .gitlab/ci/probes/pegasus-ai.yml
    inputs:
      job_name_prefix: EXPANSE
      pegasus_lite_env_source: module load singularitypro
      resource_id: 2
      probe_id: 4
      slurm_cpu_partition: shared
      slurm_gpu_partition: gpu-shared
      workflow_generator: inference
  - local: .gitlab/ci/probes/job-submit.yml
    inputs:
      job_name_prefix: STAMPEDE3
      job_name: job_submit
      resource_id: 2
      slurm_partition: shared
      slurm_account: TG-STA230005
  - local: .gitlab/ci/probes/file-download.yml
    inputs:
      job_name_prefix: STAMPEDE3
      job_name: file_download
      resource_id: 2
      slurm_partition: shared
      slurm_account: TG-STA230005
